name: Build web

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      GENERATE_SOURCEMAP: 'false'
      REACT_APP_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: newIDE/app/package-lock.json
      - name: Install editor
        run: npm ci
        working-directory: newIDE/app
      - name: Build website
        run: npm run build
        working-directory: newIDE/app
      - name: Upload website
        uses: actions/upload-artifact@v4
        with:
          name: GDevelop-debloated-web
          path: newIDE/app/build/
          if-no-files-found: error
          retention-days: 14
