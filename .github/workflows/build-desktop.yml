name: Build web

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: web-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      GENERATE_SOURCEMAP: 'false'
      REACT_APP_GOOGLE_DRIVE_CLIENT_ID: ${{ vars.GOOGLE_DRIVE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: newIDE/app/package-lock.json
      - name: Install editor
        run: npm ci
        working-directory: newIDE/app
      - name: Include free example catalog
        run: |
          mkdir -p newIDE/app/public/examples-database
          curl --fail --location --retry 3 --silent --show-error https://resources.gdevelop-app.com/examples-database/exampleShortHeaders.json --output newIDE/app/public/examples-database/exampleShortHeaders.json
          curl --fail --location --retry 3 --silent --show-error https://resources.gdevelop-app.com/examples-database/filters.json --output newIDE/app/public/examples-database/filters.json
          node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('newIDE/app/public/examples-database/exampleShortHeaders.json')); if(!Array.isArray(a)||a.length===0)process.exit(1)"
      - name: Build website
        run: npm run build
        working-directory: newIDE/app
      - name: Upload website
        uses: actions/upload-artifact@v4
        with:
          name: GDevelop-debloated-web
          path: newIDE/app/build/
          if-no-files-found: error
          retention-days: 14
